<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system','BlinkMacSystemFont','"SF Pro Display"','"SF Pro Text"','"Inter"','"Helvetica Neue"','Helvetica','Arial','system-ui','sans-serif'],
            mono: ['"SF Mono"','"JetBrains Mono"','ui-monospace','Menlo','monospace'],
            serif: ['"Instrument Serif"','"Cormorant Garamond"','Georgia','serif'],
          },
          letterSpacing: {
            tightest: '-0.045em',
          },
        }
      }
    }
  </script>
  <style>
    html { scroll-behavior: smooth; }
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "ss01","cv11";
      background: #fff;
      color: #000;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }
    /* Reveal */
    .reveal { opacity: 0; transform: translateY(28px); transition: opacity 900ms cubic-bezier(.2,.7,.2,1), transform 900ms cubic-bezier(.2,.7,.2,1); will-change: opacity, transform; }
    .reveal.in { opacity: 1; transform: none; }
    .reveal.d1 { transition-delay: 80ms; }
    .reveal.d2 { transition-delay: 160ms; }
    .reveal.d3 { transition-delay: 240ms; }
    .reveal.d4 { transition-delay: 320ms; }

    /* Subtle grain on dark project sections */
    .grain::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image: radial-gradient(rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 3px 3px; mix-blend-mode: overlay; opacity: .6;
    }

    /* Marquee chip row */
    @keyframes drift { from { transform: translateX(0) } to { transform: translateX(-50%) } }
    .drift { animation: drift 60s linear infinite; }

    /* Hide scrollbar on horizontal rails */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }

    /* Custom selection */
    ::selection { background: var(--accent, #1D9E75); color: #fff; }

    /* Sticky-nav glass */
    .glass {
      background: color-mix(in srgb, white 72%, transparent);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(0,0,0,.06);
    }

    /* Project tilted screenshot */
    .tilt-r { transform: perspective(2200px) rotateY(-14deg) rotateX(4deg) rotateZ(-1.2deg); transform-style: preserve-3d; }
    .tilt-l { transform: perspective(2200px) rotateY(14deg) rotateX(4deg) rotateZ(1.2deg); transform-style: preserve-3d; }
    .tilt-flat { transform: perspective(2200px) rotateX(6deg); transform-style: preserve-3d; }

    /* Big number stroke */
    .stroke-num {
      -webkit-text-stroke: 1px rgba(255,255,255,.18);
      color: transparent;
    }

    /* Hero blink caret */
    @keyframes caret { 50% { opacity: 0 } }
    .caret { animation: caret 1.1s steps(1) infinite; }

    /* ── Scroll progress bar ── */
    #scroll-bar {
      position: fixed; top: 0; left: 0; height: 2px; width: 0%;
      background: var(--accent, #1D9E75); z-index: 9999;
      transition: width 60ms linear;
      box-shadow: 0 0 8px rgba(29,158,117,.6);
    }

    /* ── Reveal variants ── */
    .reveal-left  { opacity: 0; transform: translateX(-36px); transition: opacity 900ms cubic-bezier(.2,.7,.2,1), transform 900ms cubic-bezier(.2,.7,.2,1); will-change: opacity, transform; }
    .reveal-right { opacity: 0; transform: translateX(36px);  transition: opacity 900ms cubic-bezier(.2,.7,.2,1), transform 900ms cubic-bezier(.2,.7,.2,1); will-change: opacity, transform; }
    .reveal-scale { opacity: 0; transform: scale(.93);         transition: opacity 800ms cubic-bezier(.2,.7,.2,1), transform 800ms cubic-bezier(.2,.7,.2,1); will-change: opacity, transform; }
    .reveal-blur  { opacity: 0; filter: blur(10px) translateY(20px); transition: opacity 1000ms ease, filter 1000ms ease; will-change: opacity, filter; }
    .reveal-left.in, .reveal-right.in, .reveal-scale.in { opacity: 1; transform: none; }
    .reveal-blur.in  { opacity: 1; filter: blur(0px) translateY(0); }
    .reveal-left.d1, .reveal-right.d1, .reveal-scale.d1, .reveal-blur.d1 { transition-delay: 80ms; }
    .reveal-left.d2, .reveal-right.d2, .reveal-scale.d2, .reveal-blur.d2 { transition-delay: 160ms; }
    .reveal-left.d3, .reveal-right.d3, .reveal-scale.d3, .reveal-blur.d3 { transition-delay: 240ms; }
    .reveal-left.d4, .reveal-right.d4, .reveal-scale.d4, .reveal-blur.d4 { transition-delay: 320ms; }

    /* ── Parallax hero ── */
    .parallax-hero { will-change: transform; }

    /* ── Counter number snap ── */
    .count-up { font-variant-numeric: tabular-nums; }

    /* ── Hero content fade ── */
    #hero-content { will-change: opacity; }

    /* ── Typing bounce dots ── */
    @keyframes typingBounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }

    /* ── Mockup bottom-sheet slide ── */
    @keyframes sheetUp { from{transform:translateY(100%);opacity:0} to{transform:translateY(0);opacity:1} }
    .sheet-up { animation: sheetUp 280ms cubic-bezier(.2,.7,.2,1) forwards; }

    /* ── Mobile: phone mockups — remove Y-rotation, slight scale ── */
    @media (max-width: 639px) {
      .tilt-r {
        transform: perspective(2200px) rotateX(4deg) rotateZ(-1.2deg) scale(0.82);
        transform-origin: top center;
        margin-bottom: -133px;
      }
      .tilt-l {
        transform: perspective(2200px) rotateX(4deg) rotateZ(1.2deg) scale(0.82);
        transform-origin: top center;
        margin-bottom: -133px;
      }
      .tilt-flat {
        transform: perspective(2200px) rotateX(3deg) scale(0.32);
        transform-origin: top center;
        margin-bottom: -422px;
      }
    }

    /* ── Tablet: enterprise dashboard scale ── */
    @media (min-width: 640px) and (max-width: 1023px) {
      .tilt-flat {
        transform: perspective(2200px) rotateX(6deg) scale(0.6);
        transform-origin: top center;
        margin-bottom: -248px;
      }
    }

    /* ── Mobile: spacing ── */
    @media (max-width: 639px) {
      .grain { padding-top: 4rem !important; padding-bottom: 4rem !important; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script>
    window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#1D9E75",

<body class="font-sans antialiased text-black">

  <div id="scroll-bar"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script>
    // Scroll progress bar
    const bar = document.getElementById('scroll-bar');
    const updateBar = () => {
      const h = document.documentElement;
      const pct = (h.scrollTop / (h.scrollHeight - h.clientHeight)) * 100;
      bar.style.width = Math.min(pct, 100) + '%';
    };
    window.addEventListener('scroll', updateBar, { passive: true });

    // Auto-init all .reveal-left / .reveal-right / .reveal-scale / .reveal-blur via MutationObserver
    const VARIANTS = ['.reveal-left', '.reveal-right', '.reveal-scale', '.reveal-blur'];
    function bindReveal(root) {
      VARIANTS.forEach(sel => {
        root.querySelectorAll(sel).forEach(el => {
          if (el._revealBound) return;
          el._revealBound = true;
          const io = new IntersectionObserver((entries) => {
            entries.forEach(e => { if (e.isIntersecting) { el.classList.add('in'); io.unobserve(el); } });
          }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
          io.observe(el);
        });
      });
    }
    const mo = new MutationObserver(() => bindReveal(document.body));
    mo.observe(document.body, { childList: true, subtree: true });
    bindReveal(document.body);

    // Hero: text fade + parallax (combined, rAF-throttled for 60fps smoothness)
    let _heroTick = false;
    const _updateHero = () => {
      const hero = document.querySelector('#top');
      const content = document.getElementById('hero-content');
      if (!hero) return;
      const heroH = hero.offsetHeight;
      const sy = window.scrollY;

      // Smooth erase: starts fading immediately, fully transparent at 48% hero scroll
      if (content) {
        const t = Math.max(0, Math.min(1, sy / (heroH * 0.48)));
        content.style.opacity = 1 - t;
      }

      // Parallax drift on heading + subtitle
      hero.querySelectorAll('.parallax-hero').forEach((el, i) => {
        el.style.transform = `translateY(${sy * (0.18 + i * 0.05)}px)`;
      });

      _heroTick = false;
    };
    window.addEventListener('scroll', () => {
      if (!_heroTick) { requestAnimationFrame(_updateHero); _heroTick = true; }
    }, { passive: true });
  </script>
</body>
</html>
